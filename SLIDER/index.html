<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Portifólio</title>
  </head>
  <body>
    <main>
      <img src="./IMG/portfolio.png">
      <div class="container" style=" 
      --width: 180px;
      --height: 100px;
      --quantity: 10;
      --gap: 100px;
      ">
        <div class="carrossel">
          <div class="item" style="--delay: 1s"><img src="./IMG/item1-1.png" /></div>
          <div class="item" style="--delay: 2s"><img src="./IMG/item1-2.png" /></div>
          <div class="item" style="--delay: 3s"><img src="./IMG/item1-3.png" /></div>
          <div class="item" style="--delay: 4s"><img src="./IMG/item1-4.png" /></div>
          <div class="item" style="--delay: 5s"><img src="./IMG/item1-5.png" /></div>
          <div class="item" style="--delay: 6s"><img src="./IMG/item1-6.png" /></div>
          <div class="item" style="--delay: 7s"><img src="./IMG/item1-7.png" /></div>
          <div class="item" style="--delay: 8s"><img src="./IMG/item1-8.png" /></div>
          <div class="item" style="--delay: 9s"><img src="./IMG/item1-9.png" /></div>
          <div class="item" style="--delay: 10s"><img src="./IMG/item1-10.png" /></div>
        </div>
      </div>


    <div class="container reverse" style=" 
      --width: 250px;
      --height: 220px;
      --quantity: 9;
      --gap:100px;
      ">
        <div class="carrossel">
          <div class="item" style="--delay: 0s"><img src="./IMG/item2-1.png" /></div>
          <div class="item" style="--delay: 1.11s"><img src="./IMG/item2-2.png" /></div>
          <div class="item" style="--delay: 2.22s"><img src="./IMG/item2-3.png" /></div>
          <div class="item" style="--delay: 3.33s"><img src="./IMG/item2-4.png" /></div>
          <div class="item" style="--delay: 4.44s"><img src="./IMG/item2-5.png" /></div>
          <div class="item" style="--delay: 5.55s"><img src="./IMG/item2-6.png" /></div>
          <div class="item" style="--delay: 6.66s"><img src="./IMG/item2-7.png" /></div>
          <div class="item" style="--delay: 7.77s"><img src="./IMG/item2-8.png" /></div>
          <div class="item" style="--delay: 8.88s"><img src="./IMG/item2-9.png" /></div>
        </div>
      </div>


    </main>
  </body>
</html>
